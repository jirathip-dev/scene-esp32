[package]
name = "scene-esp32"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]
members = ["artgen"]

[[bin]]
name = "scene-esp32"
harness = false
test = false

[features]
default = ["ili9341"]
led-gpio38 = []
ili9341 = []
st7789 = []
soak = []

[dependencies]
blocks = { git = "https://github.com/jirathip-dev/blocks", rev = "6aba85a9e01b02faeb95e9833acec16f64de6a3d" }
embedded-graphics = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = "0.53"
log = "0.4"
mipidsi = "0.10"
ssd1306 = "0.10"

[dev-dependencies]
png = "0.18"

[build-dependencies]
artgen = { path = "artgen" }
embuild = { version = "0.33.7", features = ["espidf"] }
swag = { git = "https://github.com/jirathip-dev/swag", rev = "bf9a2c6b5cb837db1e844e4746fe166cbaa06b91" }

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"
