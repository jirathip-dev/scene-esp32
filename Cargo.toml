[package]
name = "scene-esp32"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "scene-esp32"
harness = false
test = false

[features]
led-gpio38 = []
ili9341 = []
st7789 = []

[dependencies]
blocks = { git = "https://github.com/jirathip-dev/blocks", rev = "6aba85a9e01b02faeb95e9833acec16f64de6a3d" }
serde_json = "1"

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = "0.53"
log = "0.4"

[build-dependencies]
embuild = { version = "0.33.7", features = ["espidf"] }

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"
