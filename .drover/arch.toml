frozen = ["README.md", "examples/shot.rs"]
shared = ["src/main.rs"]

[[collect]]
dir = "docs"
glob = "*.md"

[[collect]]
dir = "shots/tests"
glob = "*.rs"

[comments]
policy = "strict"

[[ban]]
pattern = "esp_idf"
paths = ["src/lib.rs", "src/app.rs", "src/model/**", "src/net/**", "src/input/**", "src/art/**", "src/view/**", "src/render/**", "artgen/**", "shots/**"]
reason = "the library is pure: it builds and tests on the host; esp-idf lives in src/main.rs and src/board"

[[ban]]
pattern = "crate::model"
paths = ["src/render/**"]
reason = "render draws a Frame; view is the only reader of the model"

[[ban]]
pattern = ".gpio"
paths = ["src/**"]
except = ["src/board/pins.rs"]
reason = "the pin map is one file"

[[ban]]
pattern = "Method::Post"
paths = ["src/**"]
reason = "the device is read-only: actions wait for a later decision"

[[ban]]
pattern = "fn main"
paths = ["examples/**"]
reason = "screenshots are tests: add a file in shots/tests"

[[size]]
paths = ["src/**/*.rs", "artgen/src/**/*.rs", "shots/**/*.rs", "build.rs"]
max_file_lines = 300
max_fn_lines = 60

[[size]]
paths = ["src/main.rs"]
max_file_lines = 80
